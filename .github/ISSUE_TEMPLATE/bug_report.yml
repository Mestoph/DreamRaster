name: Bug report / Rapport de bug
description: Report a reproducible problem / Signaler un problème reproductible
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Français ou English.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "25.0.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs. Remove private information first.
      render: text
