name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: src/DreamRaster/packages.lock.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore application
        run: dotnet restore src/DreamRaster/DreamRaster.csproj -r win-x64 --locked-mode

      - name: Build application for analysis
        run: >
          dotnet build src/DreamRaster/DreamRaster.csproj
          -c Release
          -r win-x64
          --no-restore
          --nologo

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
