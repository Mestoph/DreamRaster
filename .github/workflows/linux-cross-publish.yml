name: Linux Cross Publish

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/linux/**"
      - ".github/workflows/linux-cross-publish.yml"

permissions:
  contents: read

concurrency:
  group: linux-cross-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  publish-win-x64:
    name: Publish Windows EXE from Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: src/DreamRaster/packages.lock.json

      - name: Cross publish
        shell: bash
        run: bash ./scripts/linux/publish-windows.sh

      - name: Verify single EXE
        shell: bash
        run: |
          OUT="src/DreamRaster/bin/Publish/Portable"
          test -f "$OUT/DreamRaster.exe"
          COUNT="$(find "$OUT" -maxdepth 1 -type f | wc -l)"
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one file in publish root, found $COUNT."
            find "$OUT" -maxdepth 1 -type f -print
            exit 1
          fi


