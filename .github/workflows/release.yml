name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-verify.txt

      - name: Install verifier dependencies
        run: python -m pip install -r scripts/requirements-verify.txt

      - name: Verify source tree
        run: python scripts/verify-local.py --root .

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: src/DreamRaster/packages.lock.json

      - name: Restore application
        run: dotnet restore src/DreamRaster/DreamRaster.csproj -r win-x64 --locked-mode

      - name: Run tests when test project exists
        shell: pwsh
        run: |
          $testProject = "tests\DreamRaster.Tests\DreamRaster.Tests.csproj"
          if (-not (Test-Path $testProject)) {
            Write-Host "Test project not present on this branch; skipping MSTest."
            exit 0
          }

          dotnet restore $testProject -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet test $testProject `
            -c Release `
            -r win-x64 `
            --no-restore `
            --nologo `
            --logger "console;verbosity=normal"
          exit $LASTEXITCODE

      - name: Publish portable
        run: >
          dotnet publish src/DreamRaster/DreamRaster.csproj
          -c Release
          -r win-x64
          --no-restore
          /p:PublishProfile=Portable
          --nologo

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "src\DreamRaster\bin\Publish\Portable\DreamRaster.exe"
          if (-not (Test-Path $exe)) {
            throw "DreamRaster.exe was not produced."
          }

          $files = @(Get-ChildItem "src\DreamRaster\bin\Publish\Portable" -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "DreamRaster.exe") {
            throw "Portable publish root must contain only DreamRaster.exe."
          }

      - name: Create release archive and SHA-256
        shell: pwsh
        run: |
          $archive = "DreamRaster-win-x64.zip"
          $checksum = "$archive.sha256.txt"
          $stage = "artifacts\release-package"

          if (Test-Path $archive) { Remove-Item $archive -Force }
          if (Test-Path $checksum) { Remove-Item $checksum -Force }
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }

          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item "src\DreamRaster\bin\Publish\Portable\DreamRaster.exe" "$stage\DreamRaster.exe"
          Copy-Item "LICENSE" "$stage\LICENSE"
          Copy-Item "NOTICE" "$stage\NOTICE"
          Copy-Item "THIRD_PARTY_NOTICES.md" "$stage\THIRD_PARTY_NOTICES.md"
          Copy-Item "CLA.md" "$stage\CLA.md"
          Copy-Item "DOWNLOAD_SOURCES.md" "$stage\DOWNLOAD_SOURCES.md"
          Copy-Item "README.md" "$stage\README.md"
          Copy-Item "README.en.md" "$stage\README.en.md"

          Compress-Archive -Path "$stage\*" -DestinationPath $archive -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Path $checksum -Encoding ascii -NoNewline

          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $hash) {
            throw "Release archive SHA-256 verification failed."
          }

          Write-Host "SHA-256: $hash"

      - name: Upload release build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DreamRaster-win-x64
          path: |
            DreamRaster-win-x64.zip
            DreamRaster-win-x64.zip.sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "DreamRaster-win-x64.zip" `
            "DreamRaster-win-x64.zip.sha256.txt" `
            --repo "${{ github.repository }}" `
            --generate-notes `
            --verify-tag `
            --title "${{ github.ref_name }}"

